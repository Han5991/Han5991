name: Update Contributions

on:
  schedule:
    - cron: '0 9 * * *'
      timezone: Asia/Seoul
  workflow_dispatch: # 수동 실행 가능
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'

      - name: Run update contributions
        run: node scripts/fetch-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Commit updated README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md config/last-update.json config/summary.json
          git diff --staged --quiet || git commit -m "🤖 Auto-update: Open source contributions"
          git push
